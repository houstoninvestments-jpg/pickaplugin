name = "pickaplugin"
main = "worker/index.js"
compatibility_date = "2026-10-01"
account_id = "32b17f59cb6436ea7169a23489541bd8"
workers_dev = false

[assets]
directory = "dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/p/*", "/advertise", "/advertise.html", "/advertise/", "/go/*"]

[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Stats"]

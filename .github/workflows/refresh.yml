name: Daily refresh
on:
  schedule: [{cron: "17 13 * * *"}]   # 06:17 PDT daily
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 scripts/refresh.py && python3 scripts/build.py
      - name: Commit data changes
        run: |
          git config user.name "pickaplugin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/plugins.json
          git diff --cached --quiet || (git commit -m "Daily data refresh $(date -u +%F)" && git push)
